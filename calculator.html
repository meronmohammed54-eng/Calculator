<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }

    .calculator-window {
      width: 440px;
      background-color: #242424;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      border: 1px solid #333;
    }

    /* Title Bar */
    .title-bar {
      background-color: #1e1e1e;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2d2d2d;
    }

    .title {
      font-size: 15px;
      font-weight: 500;
      color: #e0e0e0;
      margin-left: 170px; /* Center title roughly */
    }

    .window-controls {
      display: flex;
      gap: 12px;
    }

    .control-btn {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #404040;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #aaa;
      font-size: 10px;
      line-height: 1;
    }

    .control-btn:hover {
      background-color: #505050;
      color: #fff;
    }

    /* Menu Bar */
    .menu-bar {
      display: flex;
      gap: 16px;
      padding: 8px 16px;
      background-color: #242424;
      font-size: 14px;
      color: #cccccc;
    }

    .menu-item {
      cursor: pointer;
    }

    .menu-item:hover {
      color: #ffffff;
    }

    /* Screen / Displays */
    .screen {
      background-color: #1e1e1e;
      padding: 16px;
      margin: 8px 12px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-panel {
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Scrollbar styling */
    .history-panel::-webkit-scrollbar {
      width: 4px;
    }
    .history-panel::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 2px;
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      color: #e0e0e0;
    }

    .history-expr {
      letter-spacing: 0.5px;
    }

    .history-equals {
      color: #888;
    }

    .history-result {
      font-weight: 600;
    }

    .main-display {
      background-color: #2a2a2a;
      padding: 12px 16px;
      border-radius: 4px;
      text-align: right;
      font-size: 28px;
      font-weight: bold;
      color: #ffffff;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      overflow-x: auto;
      white-space: nowrap;
    }

    /* Keypad Grid */
    .keypad {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      padding: 12px;
    }

    button {
      height: 48px;
      background-color: #333333;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 17px;
      cursor: pointer;
      transition: background-color 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:hover {
      background-color: #404040;
    }

    button:active {
      background-color: #505050;
    }

    /* Action & Special Accent Buttons */
    .btn-clear {
      background-color: #a81c24;
    }
    .btn-clear:hover {
      background-color: #c4222b;
    }
    .btn-clear:active {
      background-color: #8a151b;
    }

    .btn-equal {
      background-color: #6e7552;
      grid-column: span 2;
    }
    .btn-equal:hover {
      background-color: #7e865f;
    }
    .btn-equal:active {
      background-color: #5c6244;
    }

    sub, sup {
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div class="calculator-window">
    <!-- Window Header -->
    <div class="title-bar">
      <div class="title">Calculator</div>
      <div class="window-controls">
        <div class="control-btn" title="Minimize">&minus;</div>
        <div class="control-btn" title="Maximize">&#9633;</div>
        <div class="control-btn" title="Close">&times;</div>
      </div>
    </div>

    <!-- Application Menu Bar -->
    <div class="menu-bar">
      <span class="menu-item">Calculator</span>
      <span class="menu-item">Mode</span>
      <span class="menu-item">View</span>
      <span class="menu-item">Help</span>
    </div>

    <!-- Display Area -->
    <div class="screen">
      <div class="history-panel" id="history">
        <!-- History lines populated dynamically -->
      </div>
      <div class="main-display" id="display">0</div>
    </div>

    <!-- Keypad -->
    <div class="keypad">
      <!-- Row 1 -->
      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendOperator('÷')">&divide;</button>
      <button onclick="undo()">Undo</button>
      <button class="btn-clear" onclick="clearAll()">Clear</button>

      <!-- Row 2 -->
      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="appendOperator('×')">&times;</button>
      <button onclick="appendValue('(')">(</button>
      <button onclick="appendValue(')')">)</button>

      <!-- Row 3 -->
      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendOperator('-')">&minus;</button>
      <button onclick="square()"><i>x</i><sup>2</sup></button>
      <button onclick="sqrt()">&radic;</button>

      <!-- Row 4 -->
      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button onclick="percentage()">%</button>
      <button onclick="appendOperator('+')">+</button>
      <button class="btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentExpression = '';
    let isEvaluated = false;

    const displayElement = document.getElementById('display');
    const historyElement = document.getElementById('history');

    function updateDisplay() {
      displayElement.textContent = currentExpression || '0';
    }

    function appendValue(val) {
      if (isEvaluated) {
        if (!isNaN(val) || val === '.') {
          currentExpression = '';
        }
        isEvaluated = false;
      }
      currentExpression += val;
      updateDisplay();
    }

    function appendOperator(op) {
      isEvaluated = false;
      currentExpression += op;
      updateDisplay();
    }

    function undo() {
      if (isEvaluated) {
        isEvaluated = false;
      } else {
        currentExpression = currentExpression.slice(0, -1);
      }
      updateDisplay();
    }

    function clearAll() {
      currentExpression = '';
      isEvaluated = false;
      updateDisplay();
    }

    function square() {
      if (!currentExpression) return;
      try {
        let val = evaluateExpression(currentExpression);
        let res = Math.pow(val, 2);
        addHistoryRow(`${currentExpression}²`, res);
        currentExpression = String(res);
        isEvaluated = true;
        updateDisplay();
      } catch (e) {
        displayElement.textContent = 'Error';
      }
    }

    function sqrt() {
      if (!currentExpression) return;
      try {
        let val = evaluateExpression(currentExpression);
        if (val < 0) {
          displayElement.textContent = 'Error';
          return;
        }
        let res = Math.sqrt(val);
        addHistoryRow(`√(${currentExpression})`, res);
        currentExpression = String(res);
        isEvaluated = true;
        updateDisplay();
      } catch (e) {
        displayElement.textContent = 'Error';
      }
    }

    function percentage() {
      if (!currentExpression) return;
      try {
        let val = evaluateExpression(currentExpression);
        let res = val / 100;
        currentExpression = String(res);
        updateDisplay();
      } catch (e) {
        displayElement.textContent = 'Error';
      }
    }

    function evaluateExpression(expr) {
      let sanitized = expr
        .replace(/×/g, '*')
        .replace(/÷/g, '/');
      return Function(`'use strict'; return (${sanitized})`)();
    }

    function calculate() {
      if (!currentExpression) return;
      try {
        let res = evaluateExpression(currentExpression);
        addHistoryRow(currentExpression, res);
        currentExpression = String(res);
        isEvaluated = true;
        updateDisplay();
      } catch (e) {
        displayElement.textContent = 'Error';
      }
    }

    function addHistoryRow(expr, result) {
      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `
        <span class="history-expr">${expr}</span>
        <span class="history-equals">=</span>
        <span class="history-result">${result}</span>
      `;
      historyElement.appendChild(row);
      historyElement.scrollTop = historyElement.scrollHeight;
    }

    // Keyboard controls support
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendValue(e.key);
      else if (e.key === '.') appendValue('.');
      else if (e.key === '+') appendOperator('+');
      else if (e.key === '-') appendOperator('-');
      else if (e.key === '*') appendOperator('×');
      else if (e.key === '/') appendOperator('÷');
      else if (e.key === '(' || e.key === ')') appendValue(e.key);
      else if (e.key === '%') percentage();
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Backspace') undo();
      else if (e.key === 'Escape') clearAll();
    });
  </script>
</body>
</html>
