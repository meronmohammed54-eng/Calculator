
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <div class="top-bar">
            <span>Calculator</span>

            <div class="t-buttons">
                <button class="btn"
                onclick="minimize()">−</button>
                <button class="btn" 
                onclick="maximize()">□</button>
                <button class="btn close-btn"
                onclick="closed()">×</button>
            </div>
        </div>

      
        <div class="menu">
            <span class="calculates using-cursor">Calculator</span>
            <span class="using-cursor">Mode</span>
            <span class="using-cursor">View</span>
            <span class="using-cursor">Help</span>
        </div>

        <div class="display">

            <div class="history" id="history"></div>
            <div class="current-display" id="currentDisplay">     
            </div>
        </div>

        <div class="buttons">

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('÷')">÷</button>
            <button id="showIt" onclick="undo()">Undo</button>
            <button class="clear" onclick="clearDisplay()">Clear</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('×')">×</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('-')">−</button>
            <button onclick="appendValue('²')">x²</button>
            <button onclick="appendValue('√(')">√</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="appendValue('%')">%</button>
            <button onclick="appendValue('+')">+</button>

            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
